# dev 클러스터에 올릴 것 목록 + dev에서 쓸 이미지 버전
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/platform
- ../../base/security
- ../../base/sample
- ../../base/control
- ../../base/auth
- ../../base/device
- ../../base/telemetry
- ../../base/simulator
- ../../base/infra
- ../../base/web

images:
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/auth
  newTag: sha-2c300d1
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/control
  newTag: sha-ae4a119
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/device
  newTag: sha-8969fb0
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/sample
  newTag: sha-ae4a119
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/simulator
  newTag: sha-70d2bbb
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/telemetry
  newTag: sha-907bedb
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/web
  newTag: sha-9c09a99
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/web-nginx
  newTag: sha-9c09a99

# dev 환경 설정값 (비밀번호는 Secret home-iot-secrets 에. Git엔 안 올림)
configMapGenerator:
- literals:
  - NODE_ENV=production
  - LOG_LEVEL=info
  - DB_HOST=postgres
  - DB_PORT=5432
  - DB_NAME=homeiot
  - DB_SCHEMA=dev
  - MQTT_URL=mqtt://mosquitto:1883
  - DEVICE_SERVICE_URL=http://device
  - COMMAND_TIMEOUT_MS=5000
  - OFFLINE_AFTER_SEC=20
  - SIM_INTERVAL_SEC="5"
  - SIM_FLOOR_MOVE_MS="1500"
  name: home-iot-config
  namespace: home-iot
