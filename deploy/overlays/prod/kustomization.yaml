# prod 클러스터에 올릴 것 목록 + prod 이미지 버전
# 태그는 dev에서 확인된 것만 옮겨 적는다 (새로 빌드하지 않음). 이 파일을 바꾸는 PR을 승인(머지)하면 prod에 배포
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/platform
- ../../base/security
- ../../base/infra
- ../../base/auth
- ../../base/device
- ../../base/control
- ../../base/telemetry
- ../../base/simulator
- ../../base/web
images:
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/auth
  newTag: sha-2c300d1
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/control
  newTag: sha-ae4a119
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/device
  newTag: sha-8969fb0
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/simulator
  newTag: sha-4f51360
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/telemetry
  newTag: sha-907bedb
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/web
  newTag: sha-9c09a99
- name: ghcr.io/ktcloud-cloudnative-2026/team01-visionus/web-nginx
  newTag: sha-9c09a99
# prod 환경 설정값 (dev와 DB_SCHEMA만 다름)
configMapGenerator:
- name: home-iot-config
  namespace: home-iot
  literals:
  - NODE_ENV=production
  - LOG_LEVEL=info
  - DB_HOST=postgres
  - DB_PORT=5432
  - DB_NAME=homeiot
  - DB_SCHEMA=prod
  - MQTT_URL=mqtt://mosquitto:1883
  - DEVICE_SERVICE_URL=http://device
  - COMMAND_TIMEOUT_MS=5000
  - OFFLINE_AFTER_SEC=20
  - SIM_INTERVAL_SEC="5"
  - SIM_FLOOR_MOVE_MS="1500"
