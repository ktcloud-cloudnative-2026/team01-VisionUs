# 입구로 /api/v1/devices 가 오면 device 서비스로
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: device
  namespace: home-iot
spec:
  parentRefs:
    - name: home-iot
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/devices
      backendRefs:
        - name: device
          port: 80
