# 입구로 이 주소가 오면 auth 서비스로
# 공개 경로: 로그인 전에 부르는 주소 (JWT 검사 없음)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
  namespace: home-iot
spec:
  parentRefs:
    - name: home-iot
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v1/auth/signup
        - path:
            type: Exact
            value: /api/v1/auth/login
        - path:
            type: Exact
            value: /api/v1/auth/refresh
        - path:
            type: Exact
            value: /api/v1/auth/.well-known/jwks.json
      backendRefs:
        - name: auth
          port: 80
---
# 보호 경로: 로그인한 사용자만 (게이트웨이 담당이 SecurityPolicy로 JWT 검사를 붙임)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-protected
  namespace: home-iot
spec:
  parentRefs:
    - name: home-iot
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v1/auth/logout
        - path:
            type: PathPrefix
            value: /api/v1/users
      backendRefs:
        - name: auth
          port: 80
