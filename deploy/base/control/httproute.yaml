# 입구로 /api/control 이 오면 control 서비스로
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: control
  namespace: home-iot
spec:
  parentRefs:
    - name: home-iot
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/control
      backendRefs:
        - name: control
          port: 80
