# MQTT 브로커 (클러스터 내부 전용, ClusterIP)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous false
    password_file /mosquitto/data/passwd
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
  entrypoint.sh: |
    #!/bin/sh
    set -e
    mkdir -p /mosquitto/data
    rm -f /mosquitto/data/passwd
    mosquitto_passwd -c -b /mosquitto/data/passwd "$MQTT_USERNAME" "$MQTT_PASSWORD"
    chown -R mosquitto:mosquitto /mosquitto/data
    chmod 0700 /mosquitto/data/passwd
    exec mosquitto -c /mosquitto/config/mosquitto.conf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels: { app: mosquitto, part-of: home-iot }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: mosquitto }
  template:
    metadata:
      labels: { app: mosquitto, part-of: home-iot }
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0
          command: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
          env:
            - name: MQTT_USERNAME
              valueFrom: { secretKeyRef: { name: home-iot-secrets, key: MQTT_USERNAME } }
            - name: MQTT_PASSWORD
              valueFrom: { secretKeyRef: { name: home-iot-secrets, key: MQTT_PASSWORD } }
          ports:
            - name: mqtt
              containerPort: 1883
          readinessProbe:
            tcpSocket: { port: mqtt }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: mqtt }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
            - name: data
              mountPath: /mosquitto/data
        # 브로커 지표 → /metrics (Prometheus 수집용, docs/monitoring-guide.md)
        # 브로커의 $SYS 토픽을 구독해서 연결 수 · 메시지 수를 지표로 바꿔 줌
        - name: exporter
          image: sapcc/mosquitto-exporter:0.8.0
          args: ["--endpoint", "tcp://127.0.0.1:1883", "--bind-address", "0.0.0.0:9234"]
          env:
            - name: MQTT_USER
              valueFrom: { secretKeyRef: { name: home-iot-secrets, key: MQTT_USERNAME } }
            - name: MQTT_PASS
              valueFrom: { secretKeyRef: { name: home-iot-secrets, key: MQTT_PASSWORD } }
            - name: MQTT_CLIENT_ID
              value: mosquitto-exporter
          ports:
            - name: metrics
              containerPort: 9234
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: config
          configMap: { name: mosquitto-config }
        - name: data
          emptyDir: {}   # retained meta 는 device-service 가 재연결 시 다시 발행하므로 PVC 불필요
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  labels: { app: mosquitto, part-of: home-iot }
spec:
  selector: { app: mosquitto }
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
    - name: metrics          # 브로커 지표 (Prometheus 수집용)
      port: 9234
      targetPort: metrics
