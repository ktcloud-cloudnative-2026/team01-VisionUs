# 입구로 이 주소가 오면 telemetry 서비스로 (6번에서 주소를 내 것으로 바꾸기)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: telemetry
  namespace: home-iot
spec:
  parentRefs:
    - name: home-iot
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: "^/api/v1/devices/[^/]+/events$"
      backendRefs:
        - name: telemetry
          port: 80
