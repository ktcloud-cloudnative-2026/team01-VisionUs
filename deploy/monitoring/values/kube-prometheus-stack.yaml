# kube-prometheus-stack 설정 (Prometheus · Grafana · node-exporter · kube-state-metrics)
# 차트 버전은 deploy/monitoring/monitoring-*.yaml 의 targetRevision 에서 관리합니다.
# 가이드: docs/monitoring-guide.md

prometheus:
  service:
    type: LoadBalancer        # 브라우저 접속용. IP는 monitoring-dev/prod.yaml 에서 고정 (가이드 5단계)
  prometheusSpec:
    retention: 7d                                   # 지표 보관 기간
    serviceMonitorSelectorNilUsesHelmValues: false  # 차트 밖에서 만든 ServiceMonitor도 읽음
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits:   { memory: 2Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

  # 우리 서비스 /metrics 수집
  # - deploy/base/<서비스>/service.yaml 의 app 라벨과 http 포트를 그대로 사용 (서비스 쪽 수정 없음)
  # - 서비스를 새로 추가하면 values 목록에 이름만 추가
  additionalServiceMonitors:
    - name: home-iot
      namespaceSelector:
        matchNames: [home-iot]
      selector:
        matchExpressions:
          - key: app
            operator: In
            values: [auth, control, device, telemetry, simulator]
      endpoints:
        - port: http
          path: /metrics
          interval: 30s
          honorLabels: true   # 코드가 붙인 service 라벨(예: auth-service)을 그대로 유지

    # MQTT 브로커(mosquitto) 지표 — 연결 클라이언트 수 · 메시지 수 · 버려진 메시지 수
    # deploy/base/infra/mosquitto.yaml 의 exporter 사이드카가 metrics 포트(9234)로 냄
    - name: home-iot-mqtt
      namespaceSelector:
        matchNames: [home-iot]
      selector:
        matchLabels:
          app: mosquitto
      endpoints:
        - port: metrics
          path: /metrics
          interval: 30s

  # Envoy Gateway(외부 요청 입구) 지표 수집 — web 포함 경로별 요청 수 · 에러 · 응답 시간
  # Envoy 프록시 파드는 19001 포트 /stats/prometheus 로 지표를 냄 (LoadBalancer Service에는 이 포트가 없어 PodMonitor 사용)
  additionalPodMonitors:
    - name: envoy-gateway-proxy
      namespaceSelector:
        matchNames: [envoy-gateway-system]
      selector:
        matchLabels:
          app.kubernetes.io/component: proxy
          app.kubernetes.io/managed-by: envoy-gateway
      podMetricsEndpoints:
        - port: metrics
          path: /stats/prometheus
          interval: 30s

alertmanager:
  enabled: false              # 알림은 Grafana에서 보냄

grafana:
  admin:                      # 비밀번호는 Git에 올리지 않음 → Secret grafana-admin (가이드 4단계)
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: Asia/Seoul
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  service:
    type: LoadBalancer        # 브라우저 접속용. IP는 monitoring-dev/prod.yaml 에서 고정 (가이드 5단계)
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local

# kubeadm 클러스터에서는 아래 4개가 127.0.0.1에서만 열려 있어 수집이 안 되고 DOWN으로 보임 → 끔
kubeEtcd:              { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler:         { enabled: false }
kubeProxy:             { enabled: false }
