# Grafana Alloy 설정 (로그 수집기) — 모든 파드의 stdout 로그를 Loki로 보냄
# Promtail은 2026-03-02 지원 종료 → Alloy 사용
# 가이드: docs/monitoring-guide.md

controller:
  type: deployment     # 쿠버네티스 API로 로그를 읽으므로 파드 하나면 충분
  replicas: 1

alloy:
  configMap:
    content: |
      // 1) 클러스터의 파드 목록을 찾음
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2) Grafana에서 고를 라벨 붙이기: namespace, pod, container, app
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      // 3) 로그 읽기
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      // 4) Loki로 보내기
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }
