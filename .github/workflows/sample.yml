name: sample

# 언제 돌까: sample 폴더나 이 파일이 바뀔 때만
on:
  pull_request:
    paths:
      - 'services/sample/**'
      - '.github/workflows/sample.yml'
  push:
    branches: [main]
    paths:
      - 'services/sample/**'
      - '.github/workflows/sample.yml'

permissions:
  contents: read
  packages: write   # GHCR에 이미지 올릴 권한

env:
  SERVICE: sample

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sample
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/sample/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름·태그 정하기
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인 (main에 머지됐을 때만)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 (main이면 GHCR에 올리기)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest
