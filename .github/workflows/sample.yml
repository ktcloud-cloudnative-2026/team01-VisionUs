name: sample

# 언제 돌까: sample 폴더나 이 파일이 바뀔 때만
on:
  pull_request:
    paths:
      - 'services/sample/**'
      - '.github/workflows/sample.yml'
  push:
    branches: [main]
    paths:
      - 'services/sample/**'
      - '.github/workflows/sample.yml'

permissions:
  contents: read
  packages: write   # GHCR에 이미지 올릴 권한

env:
  SERVICE: sample

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sample
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/sample/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름·태그 정하기
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인 (main에 머지됐을 때만)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 (main이면 GHCR에 올리기)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest

  # main에 머지됐을 때: dev 주문서의 이미지 태그를 새 태그로 바꿔 커밋 → Argo CD가 보고 dev에 배포 (실습 07과 같은 흐름)
  deploy-dev:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # main에 태그 커밋을 올릴 권한
    concurrency:
      group: deploy-dev-tag   # 여러 서비스가 동시에 태그를 바꿀 때 한 번에 하나씩
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: dev 태그 바꾸고 커밋
        run: |
          export IMG="ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}"
          export TAG="sha-${GITHUB_SHA::7}"
          yq -i '(.images[] | select(.name == strenv(IMG)) | .newTag) = strenv(TAG)' deploy/overlays/dev/kustomization.yaml
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): ${SERVICE} ${TAG} [skip ci]" || { echo "바뀐 것 없음"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
