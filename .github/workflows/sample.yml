name: sample

# 언제 돌까: sample 폴더나 이 파일이 바뀔 때만
on:
  pull_request:
    paths:
      - 'services/sample/**'
      - '.github/workflows/sample.yml'
  push:
    branches: [main]
    paths:
      - 'services/sample/**'
      - '.github/workflows/sample.yml'

permissions:
  contents: read
  packages: write   # GHCR에 이미지 올릴 권한

env:
  SERVICE: sample

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sample
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/sample/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 이름·태그 정하기
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인 (main에 머지됐을 때만)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 (main이면 GHCR에 올리기)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest

  # main에 머지됐을 때: dev 태그를 바꾸는 PR을 자동으로 만든다 → 사람이 머지 → Argo CD가 dev에 배포
  # (main은 PR로만 바꿀 수 있어서 직접 push 대신 PR)
  deploy-dev:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 배포용 브랜치 올리기
      pull-requests: write   # PR 만들기
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: dev 태그 바꾸고 PR 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export IMG="ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}"
          export TAG="sha-${GITHUB_SHA::7}"
          BRANCH="deploy/dev-${SERVICE}-${TAG}"
          yq -i '(.images[] | select(.name == strenv(IMG)) | .newTag) = strenv(TAG)' deploy/overlays/dev/kustomization.yaml
          git diff --quiet && { echo "바뀐 것 없음"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "deploy(dev): ${SERVICE} ${TAG}"
          git push origin "$BRANCH"
          URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          if gh pr create --base main --head "$BRANCH" \
               --title "deploy(dev): ${SERVICE} ${TAG}" \
               --body "dev의 ${SERVICE} 이미지를 ${TAG}로 바꿉니다. 머지하면 Argo CD가 dev에 배포합니다. (Actions 자동 생성)"; then
            echo "배포 PR을 만들었어요"
          else
            # 조직 설정상 Actions가 PR을 못 만들면: 실패 대신 PR 만들 링크를 남긴다
            echo "PR 자동 생성이 막혀 있어요. 아래 링크로 PR을 만들어 머지하세요:"
            echo "$URL"
            echo "### dev 배포 PR 만들기" >> "$GITHUB_STEP_SUMMARY"
            echo "[${SERVICE} ${TAG} 배포 PR 만들기](${URL})" >> "$GITHUB_STEP_SUMMARY"
          fi
