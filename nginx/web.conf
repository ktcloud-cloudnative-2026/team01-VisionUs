# =====================================================================
# 클러스터용 Nginx (Envoy Gateway 뒤, Next.js 앞)
#  - /_next/static 등 정적 파일은 캐시해서 제공
#  - 나머지 화면 요청은 Next.js(web Service)로 전달
# =====================================================================
proxy_cache_path /var/cache/nginx/next levels=1:2 keys_zone=next_static:10m max_size=200m inactive=7d use_temp_path=off;

server {
  listen 8080;
  server_tokens off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /nginx-health { access_log off; return 200 "ok\n"; }

  location /_next/static/ {
    proxy_cache next_static;
    proxy_cache_valid 200 7d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Cache-Status $upstream_cache_status;
    proxy_pass http://web:3000;
  }

  location / {
    proxy_pass http://web:3000;
  }
}
